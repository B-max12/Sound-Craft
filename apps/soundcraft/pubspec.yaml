name: soundcraft
description: "SoundCraft — Your Music. Your Rhythm. An Aur Labs product."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management & DI (plain Riverpod, no codegen — see docs/DECISIONS.md)
  flutter_riverpod: ^3.0.3
  # Typed navigation / shells / web URLs
  go_router: ^17.1.0
  # Persistence (Drift/SQLite native; WasmDatabase on web)
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  # Audio (primary engine + OS media integration + focus)
  just_audio: ^0.10.5
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  # Network
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  # Files & metadata
  file_picker: ^10.3.7
  audio_metadata_reader: ^1.5.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  intl: ^0.20.0
  shared_preferences: ^2.5.0
  uuid: ^4.5.1
  collection: ^1.19.1
  path: ^1.9.1
  meta: ^1.19.0
  just_audio_media_kit: ^2.1.0
  youtube_explode_dart: ^3.1.0
  youtube_player_iframe: ^6.0.2
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.7.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/legal/
